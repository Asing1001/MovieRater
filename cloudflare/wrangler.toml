name = "nextjs-vary-fix"
main = "vary-fix-worker.js"
compatibility_date = "2026-05-01"

# Use a ROUTE, not a Custom Domain.
# - Custom Domain would replace the existing DNS CNAME → ghs.googlehosted.com
#   (Cloud Run domain mapping) and break the origin.
# - A Route just intercepts requests at the Cloudflare edge while DNS keeps
#   pointing at Cloud Run, so the Worker's `fetch(request)` resolves to
#   Cloud Run via the existing CNAME.
routes = [
  { pattern = "www.mvrater.com/*", zone_name = "mvrater.com" }
]
